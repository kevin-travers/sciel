services:
  postgres:
    image: postgres:18
    container_name: sciel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-blueprint}
    ports:
      - "5432:5432"
    volumes:
      - sciel-postgres-data:/var/lib/postgresql/data

volumes:
  sciel-postgres-data:
